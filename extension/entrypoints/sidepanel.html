<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tamanduá QA</title>
    <style>body { font: 14px system-ui, sans-serif; margin: 0; padding: 16px; } button { margin: 4px 0; padding: 8px; width: 100%; } pre { white-space: pre-wrap; word-break: break-word; }</style>
  </head>
  <body>
    <h1>Tamanduá</h1>
    <p id="status">Comprobando servicio...</p>
    <select id="project"><option value="">Selecciona un proyecto</option></select>
    <button id="start-session">Iniciar sesión</button>
    <button id="close-session">Finalizar sesión</button>
    <p id="session">Sin sesión activa</p>
    <button id="analyze">Analizar pantalla</button>
    <button id="select">Seleccionar elemento</button>
    <button id="capture">Capturar evidencia</button>
    <h2>Hallazgos</h2>
    <select id="finding-filter"><option value="all">Todos</option><option value="candidate">Candidatos</option><option value="confirmed">Confirmados</option><option value="discarded">Descartados</option><option value="resolved">Resueltos</option></select>
    <button id="refresh-findings">Cargar hallazgos</button>
    <button id="save-candidates">Registrar candidatos del análisis</button>
    <div id="findings"></div>
    <pre id="result"></pre>
    <script type="module" src="./sidepanel/main.ts"></script>
  </body>
</html>
