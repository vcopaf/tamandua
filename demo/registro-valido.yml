name: Registro válido
startUrl: http://127.0.0.1:8080/index.html

steps:
  - action: fill
    target: "[data-testid='nombre']"
    value: "Juan Pérez"
  - action: fill
    target: "[data-testid='correo']"
    value: "qa@example.test"
  - action: click
    target: "[data-testid='guardar']"

checks:
  - type: text-visible
    value: Registro realizado correctamente
  - type: no-console-errors
  - type: no-server-errors
